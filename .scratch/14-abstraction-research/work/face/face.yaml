# 14-abstraction-research — face proof: two layered anime eyes on a head, mirrored.
#
# NO ABSOLUTE COORDINATES. Every size is a fraction of the head host; every position is a
# relation to it or to an eye anchor. Canons seeded from image.jpg (closed afterwards):
#   eye.h   = 0.35 * head.h          eye.w   = 0.55 * head.w
#   eye.cy  = head.cy - 0.65*head.ry (eyes sit high under the fringe)
#   eye.cx  = head.cx +/- 0.73*head.rx
#   nose    = head.cy + 0.05*head.ry   mouth = head.cy + 0.52*head.ry

frame: {w: 1024, h: 1024}
layers: [bg, hair, face, fringe, eyes, features]

vars:
  face_half: frame.w*0.078     # head rx — anime face is wider than tall at the temples
  face_deep: face_half*0.92    # head ry — half height

draw:
  - {rect: bg, full: true, fill: "#a8d8ce", desc: "flat backdrop"}

  # the skin patch IS the host and the ruler: every feature below is a fraction of it.
  # declared first (resolution order); painted under the hair via its `z`.
  - {ellipse: head, at: [frame.w*0.68, frame.h*0.31], rx: face_half, ry: face_deep,
     fill: "#f4e9d6", stroke: "#2a2530", sw: 3, z: face,
     desc: "head/skin ellipse — the face ruler (host)"}

  # hair: a dome over the skull + two short cheek locks, every spine in head units.
  - {blob: hair-cap, spine: [[head.cx - head.w*0.42, head.cy - head.h*0.50],
                             [head.cx, head.cy - head.h*0.72],
                             [head.cx + head.w*0.42, head.cy - head.h*0.50]],
     w: head.h*0.30, fill: "#3974ab", stroke: "#26354a", sw: 3, z: hair,
     desc: "hair dome hugging the skull, behind the face"}
  - {blob: lockL, spine: [[head.cx - head.w*0.55, head.cy - head.h*0.40],
                          [head.cx - head.w*0.60, head.cy + head.h*0.05],
                          [head.cx - head.w*0.55, head.cy + head.h*0.48]],
     w: head.w*0.24, fill: "#3974ab", stroke: "#26354a", sw: 3, z: hair,
     desc: "left temple-to-cheek lock (covers the eye corner like the ref)"}
  - {blob: lockR, spine: [[head.cx + head.w*0.55, head.cy - head.h*0.40],
                          [head.cx + head.w*0.60, head.cy + head.h*0.05],
                          [head.cx + head.w*0.55, head.cy + head.h*0.48]],
     w: head.w*0.24, fill: "#3974ab", stroke: "#26354a", sw: 3, z: hair,
     desc: "right temple-to-cheek lock"}

  # fringe: strands hanging from the dome edge over the forehead, ABOVE the skin but
  # BELOW the eyes (the ref's bangs cross the brow zone, tips stop at the upper lash).
  - {blob: bangL, spine: [[head.cx - head.w*0.34, head.cy - head.h*0.52],
                          [head.cx - head.w*0.30, head.cy - head.h*0.40],
                          [head.cx - head.w*0.33, head.cy - head.h*0.32]],
     w: head.w*0.09, fill: "#3974ab", stroke: "#26354a", sw: 2, z: fringe,
     desc: "fringe strand over the left brow"}
  - {blob: bangC, spine: [[head.cx + head.w*0.02, head.cy - head.h*0.52],
                          [head.cx - head.w*0.02, head.cy - head.h*0.42],
                          [head.cx + head.w*0.04, head.cy - head.h*0.34]],
     w: head.w*0.085, fill: "#3974ab", stroke: "#26354a", sw: 2, z: fringe,
     desc: "fringe strand between the brows, tip just over the lash"}
  - {blob: bangR, spine: [[head.cx + head.w*0.36, head.cy - head.h*0.52],
                          [head.cx + head.w*0.32, head.cy - head.h*0.40],
                          [head.cx + head.w*0.35, head.cy - head.h*0.32]],
     w: head.w*0.09, fill: "#3974ab", stroke: "#26354a", sw: 2, z: fringe,
     desc: "fringe strand over the right brow"}

  # LEFT eye: authored once with the full parameter set, placed by relation, sized in head units.
  - {eye: eyeL, host: head,
     at: [head.cx - 0.73*head.rx, head.cy - 0.58*head.ry],
     w: 0.55*head.w, h: 0.33*head.h, tilt: 5, almond: 0.62,
     sclera-fill: "#fdf2f9", iris-top-fill: "#4470b3", iris-bot-fill: "#ef92ae",
     pupil-fill: "#241a2c", lash-fill: "#0a0e18", refl-fill: "#62c7a8", glints: 2,
     z: eyes, desc: "left eye"}

  # RIGHT eye: a mirror RELATION — same params, centre reflected across the head axis,
  # tilt and inner/outer flipped. No coordinates, no hand-copied points.
  - {eye: eyeR, host: head, mirror-of: eyeL, z: eyes, desc: "right eye = eyeL mirrored"}

  # brows: short slashes above the lash, slanting DOWN toward the nose like the lash does.
  - {stroke: browL, spine: [
        [eyeL.outerx + 0.04*eyeL.w, eyeL.topy - 0.22*eyeL.h],
        [eyeL.outerx + 0.52*eyeL.w, eyeL.topy - 0.06*eyeL.h]],
     w: 0.06*eyeL.h, ink: "#241d26", z: features, desc: "left brow, above the lash"}
  - {stroke: browR, spine: [
        [eyeR.outerx - 0.04*eyeR.w, eyeR.topy - 0.22*eyeR.h],
        [eyeR.outerx - 0.52*eyeR.w, eyeR.topy - 0.06*eyeR.h]],
     w: 0.06*eyeR.h, ink: "#241d26", z: features, desc: "right brow, above the lash"}

  # nose: a tiny tick — anime noses are a slanted 2-3px dash, not a nose.
  - {stroke: nose, spine: [
        [head.cx - 0.12*head.rx, head.cy + 0.02*head.ry],
        [head.cx - 0.24*head.rx, head.cy + 0.12*head.ry]],
     w: 2.2, ink: "#8a6a58", z: features, desc: "tiny nose tick"}

  # mouth: a soft short dash, gently slanted
  - {stroke: mouth, spine: [
        [head.cx - 0.07*head.rx, head.cy + 0.49*head.ry],
        [head.cx + 0.10*head.rx, head.cy + 0.53*head.ry]],
     w: 3.2, ink: "#a08a74", z: features, desc: "soft mouth dash"}
