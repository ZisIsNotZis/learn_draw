# 13-assembly — the drawing. M1: composition and mass.
#
# This is the project's single drawing artifact (roadmap R1): every milestone patches this file.
# M1's job is NOT detail. It is: put the subject where the reference puts it, at the reference's
# scale, with the reference's masses present. Flat fills only — head quality is M2, cloth is M3,
# the soft tier is M4 (invariant 2: soft fields last).
#
# Provenance of every number in `vars:`. All measured 2026-09-15 from image.jpg by
# connected-component colour probes (not eyeballed — P19); the measurement table is in log.md.
#
# M2 attempt 3 seeded most of the head from the reference with live `region` nodes, which made
# this spec reference-dependent. That was materialized (roadmap D20): `scripts/draw freeze`
# resolved the regions once with `--ref` and froze each computed outline to a sidecar data file
# under `.scratch/13-assembly/work/traced/<node>.json`. Those sidecars are kept as the teacher's
# evidence, but the spec no longer reads any of them: every traced contour (brim far/near, face
# skin, hair mass) has been FITTED to a vocabulary family with `work/fit-family.py` and discarded
# (roadmap D24/D25), so the spec is 100% family instances, relations and authored gestures, and it
# renders with image.jpg deleted (invariant 6, P18). G7 — the traced share of the drawn head — is 0.
#
# The brim's three `traced` nodes are GONE (STATUS D24): they were fitted to the `sunhat` family
# with `work/fit-family.py` and then discarded, so the hat is now a family instance carrying
# measured proportions instead of a frozen contour. The `face-skin` trace is gone the same way:
# fitted to the `face` family (jaw + a 3/4-view `turn`) and discarded. The `hair-mass` trace is the
# last one removed: fitted to three instances of the `hair-mass` family (fringe, fall, cheek lock)
# and discarded. Nothing in the drawing is reference-derived any more.
#
# Resolution order != paint order (P20): the head is declared FIRST because everything is sized in
# units of it, and placed via `z` where it belongs visually.

frame: {w: 1024, h: 1024}

# M3c adds `arm-back`: the left forearm is hidden BEHIND the blouse (the reference shows only its
# puff sleeve and navy cuff), so the limb paints under the blouse while its sleeve/cuff paint over it.
layers: [bg, hair-inner, ribbon, hair-back, skirt-dark, leg, skirt, skirt-front, arm-back, blouse, collar,
         arm, sleeve, cuff, hand, neck, bow, hat, hat-front, head, features, hair-front]

vars:
  # ---- measured frame anchors: the "setting the frame" use of a reference (abstraction.md)
  head_half:  frame.w*0.0928    # 95px  — face box half-width; skull/eye-line width ~190px
  head_deep:  head_half*1.20    # 114px — skull top y150 -> chin y378
  head_cx:    frame.w*0.672     # 688px — face skin centroid x
  head_cy:    frame.h*0.258     # 264px — head vertical centre (150+378)/2

draw:
  # ---------------------------------------------------------------- backdrop
  - {rect: bg, full: true, fill: "#c3d7dc",
     desc: "flat backdrop — border median of the reference; the bottom-right drifts darker in the ref, deferred to M4"}

  # -------------------------------------------------------------- hair INNER FACE (was "field")
  # USER DESIGN READING (log.md 2026-09-17, authoritative): the mint mass is NOT a background
  # field — it is the HAIR's inner face. The hair is one 3D structure rooted at the head: blue
  # outer face, mint inner face (the underside the wind lifts). Measurement: at y380 the teal
  # (109,204,197) meets the head's blue (59,113,161) across one ink line; at y450 the teal runs
  # x600->x120 continuously with a slow gradient; the sheet's root shows behind the jaw
  # (mint x592-779 at y390-420) and beside the left blue lock (blue x520-637 down to y450).
  # So the old `field`/`wave`/`wave-tail` concept is DELETED and the same measured silhouette is
  # re-rooted as hair: the sheet's right end now tucks under the head (behind the jaw/collar and
  # the extended cheek lock) instead of ending at x718 as a free-floating "wave reach".
  - {ribbon: hair-inner,
     spine: [[0, 445], [185, 468], [420, 555], [660, 450], [795, 428]],
     w: [112, 240, 250, 200, 120], fill: "#7dccc1", z: hair-inner,
     desc: "the hair's wind-lifted INNER face — one sheet rooted at the head: the right end
            (x795) passes behind the jaw/collar (collar paints later) and the extended cheek
            lock (blue paints later), so the fold is a real shared boundary, not a gap. Top edge
            from the reference's measured profile: x0 y389 (ref 384), x185 y348 (ref 351),
            x420 y430 (ref 433-444); bottom edge x0 y501 (ref 501), x420 y680 (ref 676). The
            slow leftward lightening is a soft field (M4); two flat tones here"}
  # The sheet continues BEHIND the lap mass and shows again to its right (reference mint spray
  # x768-896 y680-896): same structure, one piece of hair. Re-rooted UP so it overlaps the
  # sheet's bottom edge (root top y530 vs sheet bottom ~y553 at x615) — the old start left a
  # background gap that split the hair into two read-puddles.
  - {ribbon: hair-inner-tail,
     spine: [[520, 595], [700, 740], [830, 855]],
     w: [100, 90, 55], fill: "#7dccc1", z: hair-inner,
     desc: "the inner face continuing behind the lap mass, re-emerging right of it — same hair
            structure as hair-inner. Root at (520,595): INSIDE the sheet's own bottom edge
            (sheet bottom ≈y626 at x520) and left of the bow's cover (x551), so the junction is
            visibly continuous — the old root sat behind the bow, which pixel-split the hair in
            two and read as two puddles (M4a)"}
  # The sheet's darker turn-under tone near the lap (measured x[12,222] y[732,774] #4ca5b2) —
  # where the lifted hair rolls under toward the lap. Second flat tone of the cel pair.
  - {ribbon: hair-inner-underside,
     spine: [[12, 753], [120, 748], [222, 760]],
     w: [46, 44, 30], fill: "#4ca5b2", z: hair-inner,
     desc: "the inner face's darker turn-under band where the sheet rolls toward the lap —
            the hair's second flat tone (the soft gradient is M4)"}
  # Highlight streak + curl ON the sheet (measured ≈(20-227,507-603) and (107-160,470-530)):
  # in hair terms these are the sheet's pale sheen streak and the small purple curl at its root.
  # LOW CONFIDENCE: 13-20px thin; widths are readable defaults.
  - {ribbon: sheen-streak,
     spine: [[25, 590], [120, 552], [220, 512]],
     w: [16, 22, 12], fill: "#eef7f0", z: hair-inner,
     desc: "the inner face's pale sheen streak — rubric F[6]: the mid-frame swirl tails must
            not be deleted; re-read as the hair sheet's sheen, not a field swirl"}
  - {ribbon: sheen-curl,
     spine: [[150, 472], [120, 505], [145, 532]],
     w: [18, 24, 10], fill: "#8984a6", z: hair-inner,
     desc: "the small purple curl at the sheen streak's root — measured #8984a6"}

  # ---------------------------------------------------------------- bow streamer (over the field, behind the figure)
  # M3c: the old `ribbon-sweep` was a straight purple BAR that attached to nothing (both reviewers;
  # it cost C its one lost item). Measured truth: it is ONE long streamer — a spiral curl at the top
  # left (30-160,170-260, pink) whose band sweeps down-right as the BLUE segment x[250,480]
  # y[360,443] (measured thickness 11-16px, #3a6ea8) and runs into the bow's left loop. So: root it
  # at the bow and give it the measured taper; the curl's SPIRAL is beyond the family (a ribbon
  # spine cannot close a loop) — the S-sweep suggests it, and the pink->blue gradient is a soft
  # field, i.e. M4. The old `hair-left` stroke misread this same band as hair wisps and is gone: the
  # band is the streamer's, not the hair's.
  # M3d: the streamer read as a FLOATING BAR because both ends were blunt and similar width —
  # nothing said which end is the root. A ribbon reads from its root: widest at the bow, tapering
  # to a point at the free end (a cut ribbon end, not a stick end).
  - {ribbon: streamer,
     spine: [[78, 272], [225, 360], [420, 428], [592, 506]],
     w: [5, 13, 18, 22], fill: "#3a6ea8", z: ribbon,
     desc: "the bow's long tail streamer — rooted at the bow (widest, 22px) and tapering to a
            pointed free end top-left (5px): the taper is what says 'ribbon', not 'floating bar'.
            The pink->blue gradient is deferred to M4 (soft tier)"}

  # ---------------------------------------------------------------- the ruler (declared first, painted late)
  # M2: a `face`, not an ellipse. Measured from image.jpg, the visible face is 128px wide at the
  # cheek line (y306) and tapers to a 7px chin at y377; an ellipse of the same bbox gives a ~60px
  # round bottom. cheek/jaw/chin-w are the jaw taper, in head units -- the family owns the structure.
  #
  # FITTED to the reference's frozen visible-skin mask (`traced/face-skin.json`) with the occluders
  # APPLIED (fit-family.py extracts the parameters, then the trace is discarded — STATUS D24). The
  # fit had to handle one ill-posedness explicitly: the face node is the RULER the hat, eyes and
  # hair all hang off, so if `at`/`rx`/`ry` are free the optimiser moves the whole head to match the
  # HAIR-OCCLUDED skin and the head gate collapses (measured: free fits drove rx 95->52 and the head
  # bar to edge_f1 0.328 / coverage 0.385). The head box is therefore pinned at the measured
  # skull-top->chin value (its own canon) and only the jaw shape is fitted — that is the transferable
  # part. Best visible-skin IoU 0.552 (was 0.411 with the coarse shape; 0.538 before the 3/4-view
  # `turn` was freed). The family cannot reach the ~0.85 that would mean "it can draw this skin":
  # (a) the hair-mass trace is a coarse outer contour that does not capture the fringe strands, so
  # the face shows slightly through them and is penalised, and (b) even with `turn` the family is
  # near-symmetric while the visible skin is a 3/4 view. Reported, not hidden — the hair slice has
  # to improve before this can rise.
  - {face: head, at: [head_cx, head_cy], rx: head_half, ry: head_deep,
     cheek: 0.53456, jaw: 0.72640, chin-w: 0.02523, turn: 15.0,
     fill: "#f2e9d8", z: head,
     desc: "head: cranium ball + jaw wedge tapering to the chin — the ruler every other size uses;
            jaw shape fitted to the reference's visible skin with hair occluding (face-skin trace
            discarded): cheek 0.535, jaw 0.731, chin-w 0.025. M4a: turn -11.8 -> +12.0 — the head
            must TIP down-left (the shy bow; the old sign swung the chin RIGHT of skull centre,
            which is the level stare the reviewers kept failing). M4b: 12 -> 15 — the M4a
            reviewers still read a level stare at 12 (chin 29px left is below the readability
            threshold at this scale); 15 deepens the bow while keeping the fitted jaw values
            (cheek/jaw/chin-w) untouched, and the face diagnostics stay clean
            (M4a's warning was about breaking the FITTED cheek, not about the axis).
            The yaw read is carried by the far eye being ~0.86x, not by turn.
            Re-fitted after the
            hair became a family: the new hair occludes the skin differently, and the fit rose
            0.552 -> 0.575 (the old value was scored against the traced hair). The head box is
            PINNED at the measured skull value (P28) — freeing at/rx/ry buys IoU by shrinking the
            ruler and collapses the head gate"}

  # ---------------------------------------------------------------- face features (M2)
  # All positions are HEAD-RELATIVE, from the measured apertures:
  #   near eye (screen right) aperture x[725,782] y[244,292] -> centre (754,268), 58x42
  #   far  eye (screen left)  aperture x[613,654] y[240,270] -> centre (634,262), 44x32
  # This is a 3/4 view, so the far eye is 0.75x the near one and the two are placed separately
  # -- NOT `mirror-of`, which would force them equal.
  - {eye: eyeR, host: head, at: [head.cx + 0.695*head.rx, head.cy + 0.035*head.ry],
     w: 0.288*head.w, h: 0.168*head.h, tilt: -4, almond: 0.55, iris-w: 0.52, glints: 2,
     lash-w: 0.30,
     sclera-fill: "#fdf2f9", iris-top-fill: "#4470b3", iris-bot-fill: "#4470b3",
     pupil-fill: "#241a2c", lash-fill: "#0a0e18", refl-fill: "#62c7a8", glint-fill: "#ffffff",
     z: features, desc: "near eye — layered almond, two-tone iris, tapered one-sided lash.
            M4b: w 0.305 -> 0.288 and lash-w 0.22 -> 0.30 — rev 2 read the right eye as visibly
            the larger (a 0.76 ratio reads as an error even though the reference's apertures
            measure it), and the downcast read needs a lash band heavy enough to cover the iris
            top (the M4a 0.22 left the iris fully open: the level stare). iris-bot now the same
            blue as iris-top: the pink lower wedge read as an odd red artefact (rev 2), and the
            reference's own pink there is the LID, not the iris"}
  - {eye: eyeL, host: head, at: [head.cx - 0.568*head.rx, head.cy - 0.018*head.ry],
     w: 0.248*head.w, h: 0.145*head.h, tilt: -4, almond: 0.52, iris-w: 0.34, glints: 1,
     lash-w: 0.30,
     sclera-fill: "#fdf2f9", iris-top-fill: "#4470b3", iris-bot-fill: "#4470b3",
     pupil-fill: "#241a2c", lash-fill: "#0a0e18", refl-fill: "#62c7a8", glint-fill: "#ffffff",
     z: features, desc: "far eye — M4b: 0.75x -> ~0.86x the near one (w 0.232 -> 0.248, h 0.128
            -> 0.145), lash 0.22 -> 0.30, iris-bot unified — the far eye must stay smaller (3/4
            view) but 0.76 read as a defect; 0.86 keeps the turn readable without the mismatch"}
  - {stroke: browR,
     spine: [[eyeR.outerx + 0.05*eyeR.w, eyeR.topy - 0.16*eyeR.h],
             [eyeR.innerx - 0.10*eyeR.w, eyeR.topy - 0.30*eyeR.h]],
     w: 0.075*eyeR.h, ink: "#241d26", z: features, desc: "near brow — M4b: slant INVERTED (inner
            end higher than outer). The old down-to-centre slant read as stern, the opposite of
            the shy bow; the worried/shy brow rises toward the nose"}
  - {stroke: browL,
     spine: [[eyeL.outerx + 0.05*eyeL.w, eyeL.topy - 0.14*eyeL.h],
             [eyeL.innerx - 0.10*eyeL.w, eyeL.topy - 0.28*eyeL.h]],
     w: 0.075*eyeL.h, ink: "#241d26", z: features, desc: "far brow — same inverted slant as the
            near one; the far eye is not mirrored, so neither is it"}
  - {stroke: nose,
     spine: [[head.cx - 0.10*head.rx, head.cy + 0.42*head.ry],
             [head.cx - 0.20*head.rx, head.cy + 0.50*head.ry]],
     w: 2.8, ink: "#8a7460", z: features,
     desc: "nose tick — canon A: nose at 0.73 of head height from the skull top"}
  - {stroke: mouth,
     spine: [[head.cx - 0.07*head.rx, head.cy + 0.772*head.ry],
             [head.cx - 0.005*head.rx, head.cy + 0.786*head.ry]],
     w: 3.2, ink: "#8a7460", z: features,
     desc: "mouth — canon A height; M4a: shorter and lighter (the reference's mouth is a small
            shy mark). M4b: shifted left of centre (−0.07 rx) — the bowed head carries the mouth
            with it; a centre mouth under a turned face reads as a stare"}

  # ---------------------------------------------------------------- hair
  # The hair is THREE instances of the `hair-mass` family — one silhouette each, as the vocabulary
  # sketches it (a gesture spine + a width profile). The reference's visible hair is one connected
  # mass, but it reads as three clumps: a fringe over the forehead, the long fall down the right,
  # and a cheek lock down the left. A single 4-point ribbon fits IoU 0.670 and a two-instance
  # (main + lock) decomposition 0.751; splitting the fringe out of the main raises it to 0.799
  # because the fringe and the fall have different gestures and the fringe must NOT spill onto the
  # face. All three were FITTED to the reference's frozen visible-hair mask (`traced/hair-mass.json`)
  # with `work/fit-family.py`, occluders derived from this spec's own `layers:` order (`hair-left` is
  # the only node painted above them), and the trace was then discarded (roadmap D24/D25). The fit
  # maximises mask IoU against the teacher's measurement and never reads edge_f1/color_dist
  # (invariant 4). The ceiling is the gesture form: the reference's fringe/hairline is a concave
  # corner a tapered band cannot reproduce, so ~0.80 is this family's honest approximation.
  - {hair-mass: hair-fringe, host: head,
     spine: [[head.cx - 0.81112*head.rx, head.cy - 1.06258*head.ry],
             [head.cx + 1.59920*head.rx, head.cy - 0.13827*head.ry]],
     w: [0.67420*head.w, 0.37914*head.w],
     side: both, fill: "#3974ab", z: hair-front,
     desc: "hair fringe — the broad clump across the forehead, from the left temple to the right of
            the crown (width 0.67 -> 0.38 head-widths); kept a separate instance from the fall so
            its lower edge can sit on the hairline instead of spilling onto the face"}
  - {hair-mass: hair-main, host: head,
     spine: [[head.cx + 1.49194*head.rx, head.cy - 0.25083*head.ry],
             [head.cx + 1.65501*head.rx, head.cy + 0.88037*head.ry],
             [head.cx + 2.35800*head.rx, head.cy + 2.94700*head.ry],
             [head.cx + 3.12600*head.rx, head.cy + 4.49100*head.ry]],
     w: [0.59393*head.w, 0.74700*head.w, 0.33600*head.w, 0.15800*head.w],
     side: both, fill: "#3974ab", z: hair-front,
     desc: "hair main mass — the long fall down the right, fitted as a tapered clump; M4a: the
            fall now REACHES the reference's measured extent (hair band x847-1024 y400-793):
            the strand keeps ~64px width past the elbow and ends ~y775 ON the forearm, its
            outline crossing the arm — the reference's hair lies OVER the shoulder, and rev 2's
            one absent E item was exactly this missing overlap (it ended mid-air at ~y540)"}
  - {hair-mass: hair-lock, host: head,
     spine: [[head.cx - 0.66672*head.rx, head.cy - 0.87132*head.ry],
             [head.cx - 1.42125*head.rx, head.cy + 0.09877*head.ry],
             [head.cx - 1.72*head.rx, head.cy + 1.42*head.ry]],
     w: [0.32490*head.w, 0.05294*head.w, 0.155*head.w],
     side: both, fill: "#3974ab", z: hair-front,
     desc: "hair cheek lock — the narrow strand falling down the left of the face, fitted as a
            third tapered clump; its gap to the fringe is the pink face pocket (skin through the
            notch), which is why the hair is several instances, not one silhouette.
            M4d: EXTENDED down the jaw — the reference's lock runs beside the face to y≈450
            (measured blue x520-637 y240-450, narrowing 74->16px), while the fitted clump stopped
            at y275; the third spine point (y~418) carries it to the measured tip, where the
            inner-face sheet tucks under it — the fold that roots the sheet at the head"}
  # The hair's left-side presence: the reference's only left-side HAIR below the head is one blue
  # lock that pokes out from behind the figure at (420-520,537-623) (probed #5571ae at (470,570)) —
  # the tip of the left twin-tail passing behind the body. Root it behind the bow's cover, let the
  # tip show over the field (z hair-back), and keep it UNDER the figure like the reference.
  # M3d: the twin-tail tip read as FLOATING because its visible right edge (x~525) stopped ~50px
  # short of the bow's left edge (x~576) — background on all sides of the gap. Re-rooted: the spine
  # now starts INSIDE the bow's cover and the band crosses the bow's outline, so the visible part
  # is continuous with the figure (emerging from behind it, as the reference reads).
  - {hair-mass: hair-tip, host: head,
     spine: [[head.cx - 0.70*head.rx, head.cy + 2.42*head.ry],
             [head.cx - 1.97*head.rx, head.cy + 2.86*head.ry],
             [head.cx - 2.81*head.rx, head.cy + 3.13*head.ry]],
     w: [0.34*head.w, 0.30*head.w, 0.18*head.w],
     side: both, fill: "#3974ab", z: hair-back,
     desc: "left twin-tail tip — root inside the bow's cover, sweeping down-left to the tip over
            the wave; the band crosses the bow's outline so nothing floats. Replaces the old
            `hair-left` stroke, which misread the streamer's blue band as hair"}

  # ---------------------------------------------------------------- body: blouse over the hair
  # NOTE (rolled back 2026-09-15): enlarging the cream mass to close the measured deficit made the
  # drawing WORSE (coverage 0.523 -> 0.502, grid distance 39.4 -> 43.2). The deficit is real but it
  # is not fixable by adding pale where the reference is not pale — the missing cream is the parts
  # hidden behind the bow and hair, i.e. an OCCLUSION problem for M3, not a size problem. Reverted.
  - {blob: blouse,
     spine: [[frame.w*0.745, frame.h*0.44], [frame.w*0.775, frame.h*0.55], [frame.w*0.715, frame.h*0.675]],
     w: frame.w*0.185, fill: "#ddebdd", z: blouse,
     desc: "blouse mass, chest to hip — measured pale x[691,874] y[436,688]"}

  # ---------------------------------------------------------------- neck (chin into the collar)
  # M3d: measured truth — face skin ends y378, collar starts y405, and the band between was
  # BACKGROUND at every neck column: the head hovered (the M3a defect was never actually fixed;
  # the old strip y415-455 sat entirely BELOW the gap it was meant to close). The strip now starts
  # under the jaw (overlapping it; the head paints over the join) and ends inside the collar's
  # neck-V (the neck paints after the collar, so the skin shows in the V, as a collar opening does).
  - {blob: neck, spine: [[head.cx + 0.10*head.rx, head.cy + 0.92*head.ry],
                         [head.cx + 0.09*head.rx, head.cy + 1.45*head.ry]],
     w: 0.34*head.w, fill: "#cdb69a", z: neck,
     desc: "neck from under the jaw (y~369) into the collar V (y~429) — measured x-extent
            665-730; closes the measured 27px background gap that made the head hover. The fill
            is the skin's CEL SHADOW tone (one step under #e8d7bd): the neck sits in the shadow
            of the jaw and the collar, and at the light skin tone the strip was numerically and
            visually indistinguishable from the pale backdrop"}

  # ---------------------------------------------------------------- sailor collar (M3a)
  # A collar is a flap with a neck U/V opening and a navy trim band along its outer edge, not a
  # blob. Fitted to the reference's frozen collar masks (traced/collar-pale + collar-trim*) with the
  # occluders derived from this spec's own `layers:` order, then the traces discarded (D24). The
  # 3/4 view is carried by `turn` (the neck V sits left of the collar centre, under the bow).
  # M3d: the reference's collar blue reaches y392-398 at the neck columns (measured median
  # #96c3d6 at y398-410, x692-722) — 13px higher than the fitted centre put it, which is what left
  # the V opening as backdrop between chin and collar. Raised to the measured height; the neck
  # strip fills the V as before.
  - {collar: collar, at: [784.12, 410.0], w: 188.45, h: 81.44,
     neck: 0.42060, v: 0.37127, trim: 0.32131, turn: -0.48411, tilt: -13.46198,
     fill: "#96c3d6", trim-fill: "#374b68", stroke: "#252a33", sw: 2.4, z: collar,
     desc: "sailor collar — flap + neck V opening + navy trim band along the outer U edge; the V is
            shifted left for the 3/4 view and the bow covers its left flap. Params FITTED to the
            frozen collar masks (union IoU 0.646, occluders from `layers:`) and discarded"}

  # ---------------------------------------------------------------- right upper limb (M3a)
  # The arm is ONE gesture spine (shoulder -> elbow -> wrist) carrying a puff sleeve over its upper
  # part and a cuff band at the sleeve's end; the three share the spine, so they cannot drift. Only
  # the VIEWER-RIGHT arm is drawn: the left arm and left sleeve are fully occluded by the bow
  # (measured: ~55 cream px survive, no usable bbox — measure-body.md).
  - {arm: armR, spine: [[799.17, 460.96], [884.35, 657.53], [807.19, 879.52]],
     w: [50.50, 54.52, 55.32],
     sleeve: 0.30791, puff: 1.09800, cuff-h: 33.88821, cuff-at: 0.37988, cuff-pad: 0.02442,
     fill: "#d7decc", sleeve-fill: "#e1e7dc", cuff-fill: "#2d3b58",
     stroke: "#252a33", sw: 2.4,
     z: arm, z-sleeve: sleeve, z-cuff: cuff,
     desc: "right arm — bent arm spine (shoulder, elbow, wrist) with a puff sleeve over the upper
            31% and the navy cuff band at the sleeve's end; the cuff is the elbow-side seam.
            FITTED to the frozen sleeve/cuff/limb masks (mean IoU 0.734; cuff 0.935, sleeve 0.706,
            limb 0.561) and discarded. The outline stroke is the reference's own line art — the
            sleeve and the blouse are the same cream, so without it the arm does not read"}
  # The hand: measured only WEAKLY (mauve x~845-870 y~878-928, but its colour merges with the
  # translucent petal overlay — measure-body.md gap 4), so this is the least certain node here. It
  # is drawn small and tucked at the wrist so the arm ends in a hand rather than a cut tube.
  - {hand: handR, at: [armR.wristx, armR.wristy], w: 62, h: 86, tilt: 116, fingers: 3, spread: 22,
