  # ---------------------------------------------------------------- the hat (family; one drooping brim)
  # FITTED to the teacher's frozen brim masks, then the traces discarded (STATUS D24). The three
  # `traced` brim nodes that used to stand in for both brim surfaces are gone; their geometry is now
