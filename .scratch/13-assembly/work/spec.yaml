  # `hair-mass` and the near surface had to cover the face gap; that made the fitter wrong the
  # moment the z-order was fixed (the head/hair occlude the brim now). `fit-family.py` derives its
  # occluders from the spec's own `layers:` order, so the re-fit below subtracts everything painted
  # above the hat (head + features + hair) and the near surface rises 0.594 -> 0.703 where it is
  # genuinely visible. Mean IoU 0.742 (far 0.780, near 0.703) — still under 0.85, because the
  # reference's visible top surface is split into two pieces by the head and one family surface
  # cannot reproduce that split. That failure is reported, not hidden; these are the best honest fit.
  - {sunhat: hat, host: head, brim: 4.45707*head.w, crown: 1.18063*head.w, tilt: 30.6453,
