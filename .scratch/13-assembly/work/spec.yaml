# 13-assembly — the drawing. M1: composition and mass.
#
# This is the project's single drawing artifact (roadmap R1): every milestone patches this file.
# M1's job is NOT detail. It is: put the subject where the reference puts it, at the reference's
# scale, with the reference's masses present. Flat fills only — head quality is M2, cloth is M3,
# the soft tier is M4 (invariant 2: soft fields last).
#
# Provenance of every number in `vars:`. All measured 2026-09-15 from image.jpg by
# connected-component colour probes (not eyeballed — P19); the measurement table is in log.md.
#
# M2 attempt 3 seeded most of the head from the reference with live `region` nodes, which made
# this spec reference-dependent. That is now materialized (roadmap D20): `scripts/draw freeze`
# resolved the regions once with `--ref` and froze each computed outline to a sidecar data file
# under `.scratch/13-assembly/work/traced/<node>.json`; the five `traced` nodes below read those
# vertices and never open a raster. The spec is reference-free again: it renders with image.jpg
# deleted. Each sidecar carries provenance (node id, seed/tol/eps, source image + sha256, date,
# code path), and a `traced` node refuses loudly if the sidecar is missing, malformed, or stale
# (its recorded image.jpg sha256 no longer matches the current raster). The traced geometry is the
# teacher's, not drawn from intent — the traced-vs-invented area fraction in the milestone report
# measures that debt for M5. Every other node keeps its M1 provenance and was already reference-free.
#
# Resolution order != paint order (P20): the head is declared FIRST because everything is sized in
# units of it, and placed via `z` where it belongs visually.

frame: {w: 1024, h: 1024}

layers: [bg, field, ribbon, hair-back, skirt-dark, skirt-pale, blouse, neck, bow,
         head, features, hat, hat-front, hair-front]

vars:
  # ---- measured frame anchors: the "setting the frame" use of a reference (abstraction.md)
  head_half:  frame.w*0.0928    # 95px  — face skin bbox 151px wide; skull/eye-line width ~190px
  head_deep:  head_half*1.20    # 114px — skull top y150 -> chin y378
  head_cx:    frame.w*0.672     # 688px — face skin centroid x
  head_cy:    frame.h*0.258     # 264px — head vertical centre (150+378)/2

draw:
  # ---------------------------------------------------------------- backdrop
  - {rect: bg, full: true, fill: "#c3d7dc",
     desc: "flat backdrop — border median of the reference; the bottom-right drifts darker in the ref, deferred to M4"}

  # ---------------------------------------------------------------- field (left mass)
  - {ellipse: field, at: [frame.w*0.365, frame.h*0.530], rx: frame.w*0.330, ry: frame.h*0.175,
     fill: "#7dccc1", z: field,
     desc: "mint field mass — sized to the measured AREA (126296px), not its bbox: fitting the bbox
            over-fills by 56% and puts mint where the reference has figure. Softening is M4"}

  # ---------------------------------------------------------------- ribbon sweep (over the field, behind the figure)
  - {blob: ribbon-sweep,
     spine: [[frame.w*0.07, frame.h*0.265], [frame.w*0.25, frame.h*0.355], [frame.w*0.46, frame.h*0.43]],
     w: frame.w*0.085, fill: "#6673b8", z: ribbon,
     desc: "long ribbon sweeping the left of the frame — measured band x[102,470] y[302,444]"}

  # ---------------------------------------------------------------- the ruler (declared first, painted late)
  # M2: a `face`, not an ellipse. Measured from image.jpg, the visible face is 128px wide at the
  # cheek line (y306) and tapers to a 7px chin at y377; an ellipse of the same bbox gives a ~60px
  # round bottom. cheek/jaw/chin-w are that taper, in head units -- the family owns the structure.
  - {face: head, at: [head_cx, head_cy], rx: head_half, ry: head_deep,
     cheek: 0.68, jaw: 0.37, chin-w: 0.07,
     fill: "#f2e9d8", z: head,
     desc: "head: cranium ball + jaw wedge tapering to the chin — the ruler every other size uses"}
  # The reference's VISIBLE skin (measured 151x152) is what the relational jaw only approximates:
  # hair occludes the forehead and both cheeks, so the visible skin is far smaller than the head
  # box, and the M2 jaw rendered 164x180 (9% wide, 18% tall). The surface was seeded from the
  # reference by a `region` flood and FROZEN to a sidecar (roadmap D20): the vertices are the
  # teacher's, computed once, and the spec reads them without opening a raster (P18).
  # Frozen from: region seed [head.cx, head.cy + 0.38*head.ry], tol 16, fixed, eps 3.
  - {traced: face-skin, from: traced/face-skin.json, fill: "#f2e9d8", z: head,
     desc: "visible face skin — the reference's pale area, frozen by `draw freeze` (seed 688,308;
            tol 16; eps 3); provenance + image sha256 in the sidecar. Reads vertices only"}

  # ---------------------------------------------------------------- face features (M2)
  # All positions are HEAD-RELATIVE, from the measured apertures:
  #   near eye (screen right) aperture x[725,782] y[244,292] -> centre (754,268), 58x42
  #   far  eye (screen left)  aperture x[613,654] y[240,270] -> centre (634,262), 44x32
  # This is a 3/4 view, so the far eye is 0.75x the near one and the two are placed separately
  # -- NOT `mirror-of`, which would force them equal.
  - {eye: eyeR, host: head, at: [head.cx + 0.695*head.rx, head.cy + 0.035*head.ry],
     w: 0.305*head.w, h: 0.185*head.h, tilt: -4, almond: 0.55, iris-w: 0.52, glints: 2,
     sclera-fill: "#fdf2f9", iris-top-fill: "#4470b3", iris-bot-fill: "#ef92ae",
     pupil-fill: "#241a2c", lash-fill: "#0a0e18", refl-fill: "#62c7a8", glint-fill: "#ffffff",
     z: features, desc: "near eye — layered almond, two-tone iris, tapered one-sided lash"}
  - {eye: eyeL, host: head, at: [head.cx - 0.568*head.rx, head.cy - 0.018*head.ry],
     w: 0.232*head.w, h: 0.140*head.h, tilt: -4, almond: 0.52, iris-w: 0.34, glints: 1,
     sclera-fill: "#fdf2f9", iris-top-fill: "#4470b3", iris-bot-fill: "#ef92ae",
     pupil-fill: "#241a2c", lash-fill: "#0a0e18", refl-fill: "#62c7a8", glint-fill: "#ffffff",
     z: features, desc: "far eye — 0.75x the near one (3/4 view), placed independently"}
  - {stroke: browR,
     spine: [[eyeR.outerx + 0.05*eyeR.w, eyeR.topy - 0.34*eyeR.h],
             [eyeR.innerx - 0.10*eyeR.w, eyeR.topy - 0.12*eyeR.h]],
     w: 0.075*eyeR.h, ink: "#241d26", z: features, desc: "near brow, off the eye's own anchors"}
  - {stroke: browL,
     spine: [[eyeL.outerx + 0.05*eyeL.w, eyeL.topy - 0.30*eyeL.h],
             [eyeL.innerx - 0.10*eyeL.w, eyeL.topy - 0.10*eyeL.h]],
     w: 0.075*eyeL.h, ink: "#241d26", z: features, desc: "far brow — the far eye is not mirrored, so neither is it"}
  - {stroke: nose,
     spine: [[head.cx - 0.10*head.rx, head.cy + 0.42*head.ry],
             [head.cx - 0.20*head.rx, head.cy + 0.50*head.ry]],
     w: 2.8, ink: "#8a7460", z: features,
     desc: "nose tick — canon A: nose at 0.73 of head height from the skull top"}
  - {stroke: mouth,
     spine: [[head.cx - 0.05*head.rx, head.cy + 0.755*head.ry],
             [head.cx + 0.08*head.rx, head.cy + 0.775*head.ry]],
     w: 3.4, ink: "#8a7460", z: features,
     desc: "mouth dash — canon A: 0.85-0.89 of head height; measured dark mark at (682,354)"}

  # ---------------------------------------------------------------- hair
  # The relational hair blobs re-derived the worst-approximated mass in the head: the reference's
  # visible hair is a single 876x674 component whose boundary is set by where it meets the face,
  # the neck and the hat. Two attempts at fringe + cheek-lock gestures did not reproduce it
  # (M2 att1/att2). The mass was flooded from the head anchor and FROZEN to a sidecar (D20); it is
  # the reference's own blue area, outline computed, stored as data. The left wisp stays an invented
  # gesture because the flood does not reach it and a thin sweep is exactly what the gesture form
  # is for. Frozen from: region seed [head.cx, head.cy - 0.55*head.ry], tol 40, fixed, eps 3.
  - {traced: hair-mass, from: traced/hair-mass.json, fill: "#3974ab", z: hair-front,
     desc: "hair mass — the reference's visible blue hair (fringe + both cheeks + the fall down the
            right), frozen by `draw freeze` (seed 688,202; tol 40; eps 3); reads vertices only"}
  - {stroke: hair-left,
     spine: [[frame.w*0.175, frame.h*0.32], [frame.w*0.35, frame.h*0.385], [frame.w*0.565, frame.h*0.42]],
     w: frame.w*0.014, ink: "#3974ab", z: hair-front,
     desc: "hair sweeping left across the shoulder — measured x[148,600] y[305,443] but only 13.7% filled,
            i.e. wisps not a mass: a thin stroke, not a 105px ribbon (which read as a slab)"}

  # ---------------------------------------------------------------- body: blouse over the hair
  # NOTE (rolled back 2026-09-15): enlarging the cream mass to close the measured deficit made the
  # drawing WORSE (coverage 0.523 -> 0.502, grid distance 39.4 -> 43.2). The deficit is real but it
  # is not fixable by adding pale where the reference is not pale — the missing cream is the parts
  # hidden behind the bow and hair, i.e. an OCCLUSION problem for M3, not a size problem. Reverted.
  - {blob: blouse,
     spine: [[frame.w*0.745, frame.h*0.44], [frame.w*0.775, frame.h*0.55], [frame.w*0.715, frame.h*0.675]],
     w: frame.w*0.185, fill: "#ddebdd", z: blouse,
     desc: "blouse mass, chest to hip — measured pale x[691,874] y[436,688]"}

  # ---------------------------------------------------------------- neck (chin into the collar)
  - {blob: neck, spine: [[frame.w*0.658, frame.h*0.405], [frame.w*0.658, frame.h*0.445]],
     w: frame.w*0.047, fill: "#e8d7bd", z: neck,
     desc: "neck from under the jaw into the collar — measured x[656,703] y[417,457]"}

  # ---------------------------------------------------------------- bow (the strongest colour in the figure)
  # Two loops and a knot, not one bar: a single 233px bar reads as a box. Flat fills; the fold
  # shading and the tails are M3. Measured magenta x[538,771] y[455,603], centred (671,522).
  - {ellipse: bow-loop-left, at: [frame.w*0.59, frame.h*0.51], rx: frame.w*0.061, ry: frame.h*0.070,
     fill: "#d35081", z: bow, desc: "left bow loop"}
  - {ellipse: bow-loop-right, at: [frame.w*0.72, frame.h*0.51], rx: frame.w*0.061, ry: frame.h*0.070,
     fill: "#d35081", z: bow, desc: "right bow loop"}
  - {ellipse: bow-knot, at: [frame.w*0.655, frame.h*0.51], rx: frame.w*0.028, ry: frame.h*0.038,
     fill: "#c04a78", z: bow, desc: "bow knot"}

  # ---------------------------------------------------------------- skirt / dress (bottom mass)
  - {blob: skirt-dark,
     spine: [[frame.w*0.13, frame.h*0.855], [frame.w*0.45, frame.h*0.885], [frame.w*0.82, frame.h*0.85]],
     w: frame.w*0.225, fill: "#2d4e67", z: skirt-dark,
     desc: "dark skirt mass across the bottom — measured x[51,857] y[771,1024], 71796px in two components"}
  - {blob: skirt-pale,
     spine: [[frame.w*0.625, frame.h*0.75], [frame.w*0.68, frame.h*0.845]],
     w: frame.w*0.18, fill: "#d2e2d8", z: skirt-pale,
     desc: "pale panel over the dark skirt — measured x[520,740] y[728,900]"}
  # the rainbow petals inside the skirt: the reference's most saturated area (measured pink
  # 28033px centred (324,908) + warm 33145px centred (370,935)). Flat masses in M1.
  - {blob: petal-pink,
     spine: [[frame.w*0.24, frame.h*0.87], [frame.w*0.33, frame.h*0.90], [frame.w*0.46, frame.h*0.90]],
     w: frame.w*0.13, fill: "#e2869c", z: skirt-dark, desc: "pink petal mass in the skirt"}
  - {blob: petal-warm,
     spine: [[frame.w*0.25, frame.h*0.905], [frame.w*0.36, frame.h*0.93], [frame.w*0.52, frame.h*0.92]],
     w: frame.w*0.12, fill: "#e8b48c", z: skirt-dark, desc: "warm petal mass in the skirt"}

  # ---------------------------------------------------------------- the hat (family; brim slices do the occlusion)
  - {sunhat: hat, host: head, brim: 2.905*head.w, crown: 1.105*head.w, tilt: 17,
     lift: 1.05, drop: 0.62, crown-h: 0.63, flat: 0.257, front: [0.11, 0.57], rim: 0.55, pom: 2,
     pom-at: [0.715, 0.90], pom-r: 0.16,
     crown-fill: none, brim-fill: none, rim-fill: none, pom-fill: "#df9199",
     z: hat, z-front: hat-front, z-pom: hat-front,
     desc: "wide-brim sun hat worn high. M2: crown grown to the measured 210x~95 dome (crown-navy
            above y200 is x[428,893] centre (753,109), top y20); the hat sat 19px too high — the
            reference's crown mass centres at y~92 and its brim at y~131, mine at y58/y109 — so
            lift came down 1.22 -> 1.05. The brim's two fills are its two SURFACES, not two
            halves: measured from image.jpg the brim shows a navy band along its far edge that is
            zero-width at the left tip (x455) and widens rightward (y46 at x540, y81 at x620,
            ~y194 at x860), with the teal top surface filling everything below it down to the
            near outline. So `front` picks the near arc (through the left tip and the bottom) and
            `rim` folds the far band in toward the centre -- one continuous brim outline with a
            single navy rim running round its far edge. Both poms moved to the reference's measured
            pom centroids (655,51) and (908,188): at lift 1.05 the old t=0.732 top pom sat on the
            crown's right and hid the brim's far rim at x620-700. M2 attempt 3: the brim fills are
            now `none` — the two reference-seeded `region` nodes below supply both brim surfaces, and
            this family now contributes the crown/brim ANCHOR (the region seeds hang off `hat`), the
            two poms, and the structural crown dome (also filled by the navy region). z-pom lifts
            the poms above those regions."}

  # ---- the brim's two surfaces, seeded from the reference (M2 attempt 3) ---------------------
  # A flat brim ellipse cannot express the reference's crescent droop (open defect #2), and the
  # teal/navy split re-derived from `front`/`rim` is measurably far off. Both surfaces were flooded
  # with SEEDS that are points on the sunhat's own brim anchor, so the nodes carried no typed
  # coordinates and the invented family supplied the seed; each outline is now FROZEN to a sidecar
  # (D20) and read without a raster. Frozen seeds/params are in each sidecar's provenance.
  - {traced: hat-far-navy, from: traced/hat-far-navy.json, fill: "#333f64", z: hat,
     desc: "crown + far brim navy: the reference's navy area round the brim's far edge (crown and
            far rim are one connected navy mass), frozen by `draw freeze` (seed {along: hat, t:
            0.742}; tol 28; eps 3); reads vertices only"}
  - {traced: hat-near-teal, from: traced/hat-near-teal.json, fill: "#579eaf", z: hat-front,
     desc: "brim top surface teal, left: the reference's teal area near the brim's left, seed was
            pushed 0.13 brim-widths inward from the outline at t=0.44, frozen by `draw freeze`
            (tol 28; eps 3); reads vertices only"}
  - {traced: hat-near-teal-right, from: traced/hat-near-teal-right.json, fill: "#579eaf", z: hat-front,
     desc: "brim top surface teal, right: the same surface appears to the lower-right of the hair
            (the head occludes its middle), frozen by `draw freeze` (seed 2.65 head-radii right and
            0.84 down; tol 30; eps 3); reads vertices only"}

# occlusion intent, in words — the engine raises CONTRADICTION when this disagrees with `layers`
relations:
  - {front: hat, behind: head, desc: "the hat sits on top of the head"}
  - {front: hair-front, behind: blouse, desc: "front hair falls over the blouse"}
  - {front: skirt-pale, behind: skirt-dark, desc: "the pale panel lies over the dark skirt"}
  - {front: blouse, behind: ribbon-sweep, desc: "the ribbon passes behind the figure"}
  - {front: hair-mass, behind: head, desc: "the visible hair falls in front of the face; the hat still sits over the skull"}
