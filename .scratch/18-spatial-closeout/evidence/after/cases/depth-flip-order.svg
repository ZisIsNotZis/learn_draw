<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320"><rect width="640" height="320" fill="#17232d"/><text x="18" y="28" fill="#e6edf1" font-size="17">Depth flip / source overlap and visible result</text><text x="12" y="51" fill="#e6edf1" font-size="12">INPUT DIAGNOSTIC ONLY</text><text x="12" y="67" fill="#e6edf1" font-size="12">same x/y outline</text><!-- flat source outline and translucent fill, z=0 across the face --><path id="depth-source-flat" d="M 28 78 L 176 78 L 28 222 Z" fill="#e16e87" fill-opacity="0.38" stroke="#e16e87" stroke-width="2"/><!-- sloped source has the exact same projected triangle, depth -1 to +1 --><path id="depth-source-slope" d="M 28 78 L 176 78 L 28 222 Z" fill="#3974ab" fill-opacity="0.38" stroke="#3974ab" stroke-width="2" stroke-dasharray="7 4"/><!-- equality boundary at the source footprint midpoint; this is diagnostic annotation --><path id="depth-source-equality" d="M 102 78 L 102 148" fill="none" stroke="#f4f1d0" stroke-width="1.5" stroke-dasharray="3 3"/><text x="12" y="246" fill="#e16e87" font-size="12">flat z = 0</text><text x="12" y="263" fill="#3974ab" font-size="12">sloped z: −1 → +1</text><text x="12" y="285" fill="#e6edf1" font-size="11">diagnostic overlay, not output</text><svg x="210" y="40" width="210" height="270" viewBox="0 0 210 270"><rect width="210" height="270" fill="#17232d"/><text x="18" y="28" fill="#e6edf1" font-size="17">Visible result / flat first</text><!-- depth-visible fill for semantic component flat-surface --><path id="depth-flat-first-flat-surface-fill-0" d="M 26 212.72 L 26 212.72 L 177.2 74 L 177.2 74 Z M 26 74 L 101.600756 74 L 101.600756 143.3593064 L 26 212.72 Z" fill="#e16e87" fill-rule="nonzero"/><!-- depth-visible fill for semantic component depth-flipping-strip --><path id="depth-flat-first-depth-flipping-strip-fill-1" d="M 101.600756 74 L 177.2 74 L 101.600756 143.3593064 Z" fill="#3974ab" fill-rule="nonzero"/><!-- diagnostic note 1 --><text x="12" y="255" fill="#e6edf1" font-size="13">depth winner changes at center</text></svg><svg x="430" y="40" width="210" height="270" viewBox="0 0 210 270"><rect width="210" height="270" fill="#17232d"/><text x="18" y="28" fill="#e6edf1" font-size="17">Visible result / slope first</text><!-- depth-visible fill for semantic component depth-flipping-strip --><path id="depth-slope-first-depth-flipping-strip-fill-0" d="M 101.599244 74 L 177.2 74 L 101.599244 143.3606936 Z" fill="#3974ab" fill-rule="nonzero"/><!-- depth-visible fill for semantic component flat-surface --><path id="depth-slope-first-flat-surface-fill-1" d="M 177.2 74 L 177.2 74 L 26 212.72 L 26 212.72 Z M 26 74 L 101.599244 74 L 101.599244 143.3606936 L 26 212.72 Z" fill="#e16e87" fill-rule="nonzero"/><!-- diagnostic note 1 --><text x="12" y="255" fill="#e6edf1" font-size="13">depth winner changes at center</text></svg></svg>