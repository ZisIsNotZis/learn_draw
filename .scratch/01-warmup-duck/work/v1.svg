<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- v1: LINE ART ONLY (T1). Strokes dark-brown like ref outline; occlusions via path splitting. -->
  <g id="scene">
    <!-- waterline: gentle wave across full width -->
    <path id="waterline" d="M 0 566 C 120 556, 260 576, 400 566 C 540 556, 680 574, 800 564" fill="none" stroke="#6a4e17" stroke-width="7"/>
    <!-- ripples: short light curves on water -->
    <g id="ripples" fill="none" stroke="#6a4e17" stroke-width="5" stroke-linecap="round">
      <path d="M 95 605 C 110 600, 125 600, 138 604"/>
      <path d="M 160 640 C 180 633, 210 633, 230 640"/>
      <path d="M 290 598 C 305 594, 322 594, 335 597"/>
      <path d="M 555 610 C 575 604, 610 604, 632 609"/>
      <path d="M 590 660 C 612 653, 645 653, 665 659"/>
      <path d="M 320 700 C 335 696, 350 696, 362 699"/>
    </g>
  </g>
  <g id="duck">
    <!-- body: wide egg, bottom below waterline -->
    <path id="body" d="M 330 445 C 315 540, 350 612, 465 612 C 585 612, 615 545, 612 480 C 609 415, 560 385, 480 382 C 420 380, 345 380, 330 445 Z" fill="none" stroke="#6a4e17" stroke-width="7"/>
    <!-- tail: small curl at body's upper right -->
    <path id="tail" d="M 560 405 C 570 385, 595 380, 605 395 C 613 407, 602 420, 588 418" fill="none" stroke="#6a4e17" stroke-width="7" stroke-linecap="round"/>
    <!-- head: big circle overlapping body top-left (outline continuous, sits over body) -->
    <circle id="head" cx="390" cy="295" r="108" fill="none" stroke="#6a4e17" stroke-width="7"/>
    <!-- wing: rotated ellipse mid-body -->
    <ellipse id="wing" cx="497" cy="492" rx="66" ry="47" transform="rotate(-15 497 492)" fill="none" stroke="#6a4e17" stroke-width="7"/>
    <!-- feathers: 3 curves sweeping left from wing right end -->
    <g id="feathers" fill="none" stroke="#6a4e17" stroke-width="5" stroke-linecap="round">
      <path d="M 545 465 C 510 462, 480 468, 462 478"/>
      <path d="M 552 488 C 515 486, 485 492, 468 500"/>
      <path d="M 545 510 C 515 510, 492 515, 478 521"/>
    </g>
    <!-- upper beak: rounded wedge over head's left edge -->
    <path id="beak-upper" d="M 290 296 C 250 288, 218 295, 208 307 C 202 316, 210 330, 232 336 C 255 342, 278 340, 290 336" fill="none" stroke="#6a4e17" stroke-width="7"/>
    <!-- lower beak: smaller wedge below, mouth slightly open -->
    <path id="beak-lower" d="M 290 350 C 265 348, 238 350, 226 356 C 219 361, 222 369, 234 372 C 252 376, 276 374, 290 371" fill="none" stroke="#6a4e17" stroke-width="7"/>
    <!-- mouth line between beak parts -->
    <path id="mouth" d="M 290 343 C 270 344, 250 344, 234 346" fill="none" stroke="#6a4e17" stroke-width="5" stroke-linecap="round"/>
    <!-- eye: white circle, pupil down-left, highlight up-left -->
    <circle id="eye-white" cx="363" cy="252" r="27" fill="none" stroke="#6a4e17" stroke-width="7"/>
    <circle id="pupil" cx="357" cy="258" r="15" fill="none" stroke="#6a4e17" stroke-width="5"/>
    <circle id="eye-highlight" cx="349" cy="247" r="6" fill="none" stroke="#6a4e17" stroke-width="4"/>
    <!-- head sheen: two short arcs top-left -->
    <g id="head-sheen" fill="none" stroke="#6a4e17" stroke-width="5" stroke-linecap="round">
      <path d="M 300 214 C 315 205, 332 199, 348 197"/>
      <path d="M 284 238 C 290 232, 297 227, 305 223"/>
    </g>
    <!-- nostril -->
    <circle id="nostril" cx="256" cy="315" r="5" fill="none" stroke="#6a4e17" stroke-width="4"/>
    <!-- cheek blush -->
    <ellipse id="blush" cx="398" cy="328" rx="22" ry="14" transform="rotate(-8 398 328)" fill="none" stroke="#6a4e17" stroke-width="5"/>
  </g>
</svg>
