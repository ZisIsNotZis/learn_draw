    <path id="pink-pocket-2" d="M 286 128 L 348 125 L 350 175 C 335 190, 310 194, 292 190 C 287 170, 285 148, 286 128 Z" fill="#d7b1c7" stroke="none"/>
    <!-- hair-top: ONE silhouette, zigzag bottom edge (traced) -->
    <path id="hair-top" d="M 0 0 L 500 0 L 500 60 L 352 55 L 352 128
             C 349 136, 346 143, 344 150
             C 341 168, 337 188, 333 204
             C 329 188, 325 164, 323 150
             C 318 150, 313 149, 309 148
             C 306 158, 304 167, 303 176
             C 299 164, 295 152, 292 142
             C 288 144, 285 146, 282 147
             C 277 165, 274 185, 272 203
             C 250 198, 225 188, 205 178
             C 192 171, 180 160, 173 152
             C 170 158, 168 170, 167 179
             C 158 170, 143 157, 130 146
             C 124 128, 118 105, 114 93
             C 104 89, 92 89, 84 92
             C 80 130, 78 190, 77 232
             C 76 252, 73 264, 66 272
             C 50 276, 34 273, 20 266
