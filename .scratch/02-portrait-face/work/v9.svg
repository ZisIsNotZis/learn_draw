    <!-- right mass: curvy left edge per trace -->
    <!-- right mass: fill only (shared edge with hair-top must not show a seam) -->
    <path id="hair-right" d="M 352 55 L 500 215 L 500 540 L 434 540
             C 420 520, 406 500, 402 478
             C 398 458, 394 440, 390 420
             C 386 400, 380 380, 382 350
             C 384 320, 378 260, 372 210
             C 366 170, 358 110, 352 55 Z" fill="#3974ab" stroke="none"/>
    <!-- right mass visible edge line (only where it borders pink/skin) -->
    <path id="hair-right-edge" d="M 352 55 C 360 110, 366 170, 372 210 C 378 260, 384 320, 382 350 C 380 380, 386 400, 390 420 C 394 440, 398 458, 402 478 C 406 500, 420 520, 434 540" fill="none" stroke="#26354a" stroke-width="3"/>
    <!-- S-curl band, widened per trace -->
    <path id="hair-curl" d="M 390 313
             C 355 325, 330 342, 319 362
             C 311 378, 310 390, 316 398
             C 321 405, 330 407, 338 404
             C 328 415, 315 425, 305 436
             C 295 447, 290 458, 293 466
             C 296 473, 304 477, 312 475
             C 320 472, 327 463, 332 452
             C 337 441, 344 429, 352 421
             C 362 413, 371 404, 377 393
             C 373 381, 367 364, 371 348
             C 375 334, 380 320, 390 313 Z" fill="#3974ab"/>
