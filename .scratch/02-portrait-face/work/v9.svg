    <!-- hat corner over hair -->
    <path id="hat-corner" d="M 415 0 L 500 0 L 500 195 C 470 155, 448 105, 434 60 C 426 38, 419 18, 415 0 Z" fill="#333e5a"/>
  </g>
</svg>
